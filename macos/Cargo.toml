[package]
name = "a704f-macos"
version = "0.1.0"
edition = "2021"
description = "Native macOS configuration CLI for the Instant A704F mouse"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
ctrlc = "3.4"
hidapi = "2.6"
rdev = "0.5"

[dev-dependencies]
tempfile = "3.13"