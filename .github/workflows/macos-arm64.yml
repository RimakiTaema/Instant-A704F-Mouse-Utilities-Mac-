name: macOS Apple Silicon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6 and CMake
        run: brew install qt cmake

      - name: Configure Qt app
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build Qt app
        run: cmake --build build --config Release --parallel

      - name: Bundle Qt frameworks
        run: "$(brew --prefix qt)/bin/macdeployqt build/A704F_Mouse.app"

      - name: Verify Apple Silicon app
        run: |
          test "$(uname -m)" = arm64
          test -d build/A704F_Mouse.app/Contents/Frameworks
          lipo -archs build/A704F_Mouse.app/Contents/MacOS/A704F_Mouse | grep -qw arm64

      - name: Stage app bundle
        run: |
          mkdir -p build/artifacts
          ditto build/A704F_Mouse.app build/artifacts/A704F_Mouse.app

      - name: Upload unsigned macOS Qt app
        uses: actions/upload-artifact@v7
        with:
          name: A704F-Mouse-macOS-arm64
          path: build/artifacts
          if-no-files-found: error